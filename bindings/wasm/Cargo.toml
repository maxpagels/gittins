# The browser/JS binding: the public API (core/src/api.rs) exposed to
# JavaScript via wasm-bindgen, packaged for npm by wasm-pack (PR 22). The
# core crate stays zero-dependency; wasm-bindgen lives here.
[package]
name = "gittins-wasm"
version = "1.0.4"
edition = "2021"
description = "WebAssembly binding for the gittins contextual bandit engine"
license = "MIT"
repository = "https://github.com/maxpagels/gittins"
homepage = "https://docs.getgittins.dev"
documentation = "https://docs.getgittins.dev"
keywords = ["bandit", "contextual-bandit", "machine-learning", "online-learning", "exploration"]
categories = ["algorithms", "science"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
gittins-core = { path = "../../core" }
wasm-bindgen = "0.2"
js-sys = "0.3"

[dev-dependencies]
wasm-bindgen-test = "0.3"
