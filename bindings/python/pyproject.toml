[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "gittins"
version = "1.0.1"
description = "An opinionated, highly optimised contextual bandit engine"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Max Pagels" }]
keywords = [
    "contextual bandit",
    "multi-armed bandit",
    "reinforcement learning",
    "online learning",
    "exploration",
    "recommendation",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
]
dependencies = []

# The apex getgittins.dev is not serving (404); only the docs subdomain is
# live, so Homepage points there rather than at a dead link on the PyPI page.
[project.urls]
Homepage = "https://docs.getgittins.dev"
Documentation = "https://docs.getgittins.dev"
Repository = "https://github.com/maxpagels/gittins"

[tool.maturin]
features = ["pyo3/extension-module"]
