# CI for the gittins reference implementation.
#
# The test suite pins expected outputs at the bit level (pinned vectors in
# tests/, plus regeneration of spec/golden.json), so every matrix leg is a
# bit-identity check (R6). Ubuntu-only for cost; macOS/Windows legs are
# deferred, to be revisited when the compiled core lands — cross-OS
# bit-identity is a release gate even if it isn't a per-PR gate.
#
# The sim job runs the environment battery (sim/) once — one leg, not the
# matrix, because sims are statistical, not bit-identity checks — and
# appends its markdown table to the job summary, so regret against the
# baselines is readable on every PR. Diagnostic, not a gate.
#
# Planned growth (design doc sections 8 and 10): the full battery and sweep
# report (PR 13); the Rust core and each language binding checked against
# spec/golden.json; macOS/Windows/WASM legs.

name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: ${{ matrix.python }}
      - name: Run test suite
        run: uv run pytest -q

  sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.13"
      - name: Run environment battery
        run: uv run python -m sim | tee -a "$GITHUB_STEP_SUMMARY"
