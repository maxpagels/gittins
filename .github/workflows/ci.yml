# CI for the gittins reference implementation.
#
# The test suite pins expected outputs at the bit level (pinned vectors in
# tests/, plus regeneration of spec/golden.json), so every matrix leg is a
# bit-identity check (R6). Ubuntu-only for cost; macOS/Windows legs are
# deferred, to be revisited when the compiled core lands — cross-OS
# bit-identity is a release gate even if it isn't a per-PR gate.
#
# The sim job runs the environment battery (sim/) once — one leg, not the
# matrix, because sims are statistical, not bit-identity checks — and
# appends its markdown table to the job summary, so regret against the
# baselines is readable on every PR. Diagnostic, not a gate.
#
# The rust job is the compiled core (core/): `cargo test` includes the
# golden corpus and verifies every section bit for bit — the same contract
# the reference pins itself to — and the battery reruns on the Rust core
# into the same job summary, so the two tables can be compared line by
# line (they should be identical: same counter-RNG streams, same libm on
# one platform; only the runtime differs).
#
# Planned growth (design doc sections 8 and 10): each language binding
# checked against spec/golden.json; macOS/Windows/WASM legs.

name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: ${{ matrix.python }}
      - name: Run test suite
        run: uv run pytest -q

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.13"
      - name: Run environment battery
        run: uv run python -m sim | tee -a "$GITHUB_STEP_SUMMARY"

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify the core against the golden corpus
        run: cargo test --manifest-path core/Cargo.toml
      - name: Run environment battery on the Rust core
        run: cargo run --release --manifest-path core/Cargo.toml --bin sim | tee -a "$GITHUB_STEP_SUMMARY"

  # The Python binding: build the wheel (maturin via the PEP 517 backend),
  # replay the golden api section through it — the binding acceptance gate
  # (spec/api.md) — and append the decision-cycle benchmark to the summary
  # so boundary-crossing regressions are visible next to the battery tables.
  python-binding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.13"
      - name: Build and install the binding + the reference
        run: |
          uv venv
          uv pip install . ./bindings/python pytest
      - name: Golden gate + binding tests
        run: .venv/bin/python -m pytest bindings/python/tests -q
      - name: Decision-cycle benchmark
        run: .venv/bin/python bindings/python/bench.py | tee -a "$GITHUB_STEP_SUMMARY"
