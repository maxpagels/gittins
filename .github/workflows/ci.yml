# CI for the gittins reference implementation.
#
# The test suite pins expected outputs at the bit level (pinned vectors in
# tests/, plus regeneration of spec/golden.json), so every matrix leg is a
# bit-identity check. Ubuntu-only for cost; macOS/Windows legs are
# deferred, to be revisited when the compiled core lands — cross-OS
# bit-identity is a release gate even if it isn't a per-PR gate.
#
# The sim job runs the environment battery (sim/) once — one leg, not the
# matrix, because sims are statistical, not bit-identity checks — and
# appends its markdown table to the job summary, so regret against the
# baselines is readable on every PR. Diagnostic, not a gate.
#
# The rust job is the compiled core (core/): `cargo test` includes the
# golden corpus and verifies every section bit for bit — the same contract
# the reference pins itself to — and the battery reruns on the Rust core
# into the same job summary, so the two tables can be compared line by
# line (they should be identical: same counter-RNG streams, same libm on
# one platform; only the runtime differs).
#
# Planned growth (design doc sections 8 and 10): each language binding
# checked against spec/golden.json; macOS/Windows/WASM legs.

name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: ${{ matrix.python }}
      - name: Run test suite
        run: uv run pytest -q

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.13"
      - name: Run environment battery
        run: uv run python -m sim | tee -a "$GITHUB_STEP_SUMMARY"

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify the core against the golden corpus
        run: cargo test --manifest-path core/Cargo.toml
      - name: Run environment battery on the Rust core
        run: cargo run --release --manifest-path core/Cargo.toml --bin sim | tee -a "$GITHUB_STEP_SUMMARY"

  # The bindings job, both bindings end to end. Python: build the wheel
  # (maturin via the PEP 517 backend) and replay the golden api section
  # through it — the binding acceptance gate. Wasm: the same
  # gate plus the serialization section under Node — also the project's
  # cross-platform bit-identity check, since WASM mandates IEEE-754
  # semantics — and a packaging smoke build. Then the decision-cycle
  # benchmark into the summary: native core / wheel / wasm / pure reference
  # in one table, so both engine and boundary regressions are visible next
  # to the battery tables.
  bindings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.13"
      - name: Build and install the Python binding + the reference
        run: |
          uv venv
          uv pip install . ./bindings/python pytest
      - name: Golden gate + tests, Python binding
        run: .venv/bin/python -m pytest bindings/python/tests -q
      - name: Golden gate + tests, CLI binding
        run: cargo test --manifest-path bindings/cli/Cargo.toml
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Golden gate under Node, wasm binding
        run: wasm-pack test --node bindings/wasm
      - name: Package smoke build (wasm for the web)
        run: wasm-pack build --target web bindings/wasm
      # The published npm package, built and then consumed the way a user
      # would: pack it, install it into an empty project, and import it with
      # no init() call. The three-target exports map is the whole point of
      # that package, and its failure modes (a wrong `type` field, a stale
      # exports path) are invisible to a plain build — they only appear on
      # import, which is why this installs the tarball rather than poking at
      # the out-dir. The web entry is left to `wasm-pack test --node` above
      # and a browser; it needs a fetchable URL Node does not provide.
      - name: Build the npm package
        run: make npm-pkg
      - name: Consume the npm package as a user would
        run: |
          mkdir -p /tmp/npmsmoke/proj
          npm pack bindings/wasm/pkg-npm --pack-destination /tmp/npmsmoke
          cd /tmp/npmsmoke/proj
          npm init -y >/dev/null && npm pkg set type=module >/dev/null
          npm install /tmp/npmsmoke/gittins-*.tgz
          cat > esm.mjs <<'EOF'
          import * as gittins from "gittins";
          const s = gittins.create(8, 3600.0);
          const c = [["a", {}], ["b", {}]];
          const r = gittins.decide(s, { device: "mobile" }, c, 1700000000.0, "salt");
          if (typeof c[r.chosen][0] !== "string") throw new Error("no arm chosen");
          const ser = gittins.serialize(s);
          if (gittins.serialize(gittins.deserialize(ser)) !== ser) throw new Error("roundtrip");
          console.log("npm ESM entry OK, no init() needed");
          EOF
          cat > cjs.cjs <<'EOF'
          const gittins = require("gittins");
          const s = gittins.create(8, 3600.0);
          gittins.decide(s, { device: "mobile" }, [["a", {}], ["b", {}]], 1700000000.0, "salt");
          console.log("npm CJS entry OK, no init() needed");
          EOF
          node esm.mjs && node cjs.cjs
      # The benchmark compares four implementations in one table, so this
      # job also builds the native-core bench binary and the wasm package
      # for Node (bench.py degrades cells to "not built" if absent).
      - name: Build the native-core benchmark binary
        run: cargo build --release --bin bench --manifest-path core/Cargo.toml
      - name: Build the wasm package for Node
        run: wasm-pack build --target nodejs --out-dir pkg-node bindings/wasm
      - name: Decision-cycle benchmark
        run: .venv/bin/python bindings/python/bench.py --json bench-head.json | tee -a "$GITHUB_STEP_SUMMARY"
      # On PRs, benchmark the merge base back to back on this same runner
      # and append the delta table. The baseline's artifacts (wheel,
      # reference, core binary, wasm package) are built from the base
      # checkout in baseline/, but both runs use the PR's bench.py, so the
      # harness is held constant and only the measured code differs.
      - name: Check out the merge base
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline
      - name: Build the baseline benchmark artifacts
        if: github.event_name == 'pull_request'
        run: |
          cd baseline
          uv venv
          uv pip install . ./bindings/python
          cargo build --release --bin bench --manifest-path core/Cargo.toml
          wasm-pack build --target nodejs --out-dir pkg-node bindings/wasm
      - name: Decision-cycle benchmark, merge base
        if: github.event_name == 'pull_request'
        run: >
          GITTINS_BENCH_ROOT=baseline
          baseline/.venv/bin/python bindings/python/bench.py --json bench-base.json > /dev/null
      - name: Benchmark delta vs main
        if: github.event_name == 'pull_request'
        run: .venv/bin/python bindings/python/bench.py --compare bench-base.json bench-head.json | tee -a "$GITHUB_STEP_SUMMARY"
