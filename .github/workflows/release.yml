# Release: build the Python binding's wheels and publish them to PyPI,
# publish the wasm binding to npm, and attach the `gittins` CLI's prebuilt
# binaries (plus install.sh) to a GitHub Release.
#
# Cut a release with `make release BUMP=patch|minor|major` on main. That
# bumps every shipped manifest, refreshes the lock files, commits, tags,
# and pushes; the tag push is what runs this workflow. Nothing here is
# meant to be triggered by hand except as a retry.
#
# Publishing uses Trusted Publishing (OIDC), registered on PyPI against
# this repo, the filename `release.yml`, and the `pypi` environment — so
# there is no API token in the repo secrets. All three must keep matching
# the publisher registered on PyPI; renaming this file breaks releases.
#
# The core crate is a path dependency (../../core) and there is no cargo
# workspace, but maturin rewrites the path and vendors core/ into the
# sdist, so the sdist builds standalone — verified by installing it into a
# clean venv.
#
# abi3-py310 means one wheel covers CPython >= 3.10, so the matrix is one
# leg per platform/arch rather than per platform per Python version.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The release gate. `make release` runs these locally too, but a tag can
  # reach GitHub without going through the Makefile, and the golden corpus
  # is the contract that all four bindings implement the same engine —
  # publishing a wheel that fails it would ship a binding that disagrees
  # with the spec.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
      - name: Reference test suite
        run: uv run pytest -q
      - name: Verify the core against the golden corpus
        run: cargo test --manifest-path core/Cargo.toml
      # The CLI's own gate: the golden `ope` section, which the binaries
      # attached to the GitHub Release must agree with.
      - name: Verify the CLI against the golden corpus
        run: cargo test --manifest-path bindings/cli/Cargo.toml
      - name: Tag must match the packaged version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(grep -m1 '^version' bindings/python/pyproject.toml | cut -d'"' -f2)
          echo "tag=$tag pyproject=$pkg"
          test "$tag" = "$pkg" || {
            echo "::error::tag v$tag does not match pyproject version $pkg"
            exit 1
          }

  # maturin is invoked directly here rather than through maturin-action, which
  # is what the wheel legs use. For 1.0.0 this job ran green and produced no
  # sdist, and the action's handling of `--out` is the likely reason: it
  # appends its own output directory, so the tarball lands in target/wheels
  # while the upload looks in dist/. Calling maturin ourselves means the
  # command that runs here is the one that was tested by hand, and there is no
  # container or argument rewriting in between.
  sdist:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.13"
      - name: Build the sdist
        run: uv run --with 'maturin>=1.7,<2' maturin sdist -m bindings/python/Cargo.toml -o dist
      # An sdist that does not build standalone is worse than none: the core
      # crate is a path dependency (../../core) with no cargo workspace, so
      # this proves maturin vendored it before the file can be published.
      - name: The sdist must install into a clean environment
        run: |
          test -f dist/gittins-*.tar.gz
          uv venv /tmp/sdistcheck
          uv pip install --python /tmp/sdistcheck/bin/python dist/gittins-*.tar.gz
          /tmp/sdistcheck/bin/python -c "
          import gittins
          s = gittins.create(8, 3600.0)
          r = gittins.decide(s, {'device': 'mobile'}, [('a', {}), ('b', {})], 1700000000.0, 'salt')
          assert isinstance(gittins.serialize(s), str)
          print('sdist installs and runs standalone')
          "
      - uses: actions/upload-artifact@v6
        with:
          name: dist-sdist
          path: dist
          # Default is `warn`, which is how 1.0.0 shipped five wheels and no
          # sdist: an empty upload is not a failure, so the job went green and
          # publish carried on with what it had.
          if-no-files-found: error

  wheels:
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
          - os: ubuntu-latest
            target: aarch64
          - os: macos-latest
            target: x86_64
          - os: macos-latest
            target: aarch64
          - os: windows-latest
            target: x64
    steps:
      - uses: actions/checkout@v5
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          # `auto` picks the oldest manylinux the toolchain supports; the
          # core crate is zero-dependency, so this stays maximally
          # compatible. Ignored off Linux.
          manylinux: auto
          args: --release --out dist -m bindings/python/Cargo.toml
          sccache: true
      - uses: actions/upload-artifact@v6
        with:
          name: dist-${{ matrix.os }}-${{ matrix.target }}
          path: dist
          if-no-files-found: error

  publish:
    needs: [sdist, wheels]
    runs-on: ubuntu-latest
    # Must match the environment named on PyPI's publisher, and is where a
    # required-reviewer gate on releases would go.
    environment: pypi
    permissions:
      # Mints the short-lived OIDC token Trusted Publishing exchanges for
      # an upload token. Without this the publish step 403s.
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - run: ls -l dist
      # Assert the shape of the upload before it becomes permanent. A version
      # is only published once, so an incomplete set (1.0.0 went out with five
      # wheels and no sdist) is not something a re-run can repair — better to
      # refuse to publish than to publish something that has to be superseded.
      - name: The upload must contain an sdist and every wheel
        run: |
          sdists=$(ls dist/*.tar.gz 2>/dev/null | wc -l)
          wheels=$(ls dist/*.whl 2>/dev/null | wc -l)
          echo "sdists=$sdists wheels=$wheels"
          test "$sdists" -eq 1 || { echo "::error::expected 1 sdist, got $sdists"; exit 1; }
          test "$wheels" -eq 5 || { echo "::error::expected 5 wheels, got $wheels"; exit 1; }
      - uses: pypa/gh-action-pypi-publish@release/v1

  # npm, off the same tag as PyPI. Both registries publishing from one trigger
  # is the point: the wheel and the npm package are the same engine at the same
  # version, and a manual npm publish alongside an automatic PyPI release is
  # exactly how they drift apart.
  #
  # Authentication is Trusted Publishing (OIDC), registered on npmjs.com
  # against this repo, `release.yml`, and the `npm` environment below — so no
  # NPM_TOKEN. `setup-node` is deliberately configured without `registry-url`:
  # that option writes an .npmrc expecting NODE_AUTH_TOKEN, which is the
  # token-based path this replaces.
  npm:
    needs: test
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      # OIDC publishing needs a newer npm than the one bundled with node.
      - name: Update npm
        run: npm install -g npm@latest && npm --version
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Build the npm package
        run: make npm-pkg
      # The package version comes from bindings/wasm/Cargo.toml, which the
      # release bump rewrote; check it against the tag the same way the Python
      # side does, so a mismatch fails before it is published rather than after.
      - name: Tag must match the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./bindings/wasm/pkg-npm/package.json').version")
          echo "tag=$tag package=$pkg"
          test "$tag" = "$pkg" || {
            echo "::error::tag v$tag does not match npm package version $pkg"
            exit 1
          }
      - name: Publish to npm
        run: npm publish bindings/wasm/pkg-npm --access public

  # The `gittins` CLI as prebuilt binaries, off the same tag, for the same
  # five platforms as the wheels. Linux builds against musl, so one static
  # binary runs on every distro; flate2's default backend and serde_json
  # are pure Rust, so there is no C dependency to link. The archive names
  # are the contract install.sh downloads by; keep the two in step.
  cli:
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          # Cross-compiled on the ARM runner, so it is built but not run.
          - os: macos-latest
            target: x86_64-apple-darwin
            cross: true
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        run: cargo build --release --locked --manifest-path bindings/cli/Cargo.toml --target ${{ matrix.target }}
      # The binary that ships, run on the committed example log: a build
      # that links but cannot read a log is caught here, not by a user.
      - name: Smoke test
        if: ${{ !matrix.cross }}
        shell: bash
        run: |
          bin=bindings/cli/target/${{ matrix.target }}/release/gittins
          "$bin" --version
          "$bin" verify --log examples/decisions.jsonl
      - name: Package
        shell: bash
        run: |
          bin=bindings/cli/target/${{ matrix.target }}/release/gittins
          stage=$(mktemp -d)
          mkdir -p dist
          cp LICENSE "$stage/"
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp "$bin.exe" "$stage/"
            (cd "$stage" && 7z a "$GITHUB_WORKSPACE/dist/gittins-${{ matrix.target }}.zip" gittins.exe LICENSE)
          else
            cp "$bin" "$stage/"
            tar -czf "dist/gittins-${{ matrix.target }}.tar.gz" -C "$stage" gittins LICENSE
          fi
      - uses: actions/upload-artifact@v6
        with:
          name: cli-${{ matrix.target }}
          path: dist
          if-no-files-found: error

  # One job creates the GitHub Release from every archive at once, so a
  # failed platform means no release rather than a partial one — the same
  # rule the PyPI publish enforces on its wheels. Tags only: a manual
  # workflow_dispatch retry builds the binaries but has no tag to attach
  # them to.
  github-release:
    needs: cli
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Tag must match the CLI version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(grep -m1 '^version' bindings/cli/Cargo.toml | cut -d'"' -f2)
          echo "tag=$tag cli=$pkg"
          test "$tag" = "$pkg" || {
            echo "::error::tag v$tag does not match bindings/cli version $pkg"
            exit 1
          }
      - uses: actions/download-artifact@v7
        with:
          pattern: cli-*
          merge-multiple: true
          path: dist
      - name: The upload must contain every platform
        run: |
          tars=$(ls dist/*.tar.gz 2>/dev/null | wc -l)
          zips=$(ls dist/*.zip 2>/dev/null | wc -l)
          echo "tars=$tars zips=$zips"
          test "$tars" -eq 4 || { echo "::error::expected 4 tar.gz archives, got $tars"; exit 1; }
          test "$zips" -eq 1 || { echo "::error::expected 1 zip archive, got $zips"; exit 1; }
      # install.sh ships as a release asset, so the latest/download URL
      # always serves the script that matches the latest binaries.
      - name: Add the installer and checksums
        run: |
          cp install.sh dist/
          cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
