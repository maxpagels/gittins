[project]
name = "gittins-reference"
version = "0.0.1"
description = "Pure-Python reference implementation of the gittins contextual bandit engine"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gittins_reference"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
